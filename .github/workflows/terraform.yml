name: "Terraform Pipeline"

on:
  # Run `terraform apply` on push to main, once approved.
  push:
    branches: [ "main" ]
  # Run `terraform plan` on pull request to main.
  pull_request:
    branches: [ "main" ]

concurrency:
  group: terraform-oci-tenancy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan"
    # Explicitly pin to latest version for reproducibility.
    runs-on: ubuntu-26.04

    outputs:
      plan_artifact: ${{ steps.plan_artifact.outputs.name }}

    defaults:
      run:
        working-directory: ./src

    env: &terraform_env
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
      # A list variable, so the secret must hold JSON, e.g. ["203.0.113.4/32"].
      TF_VAR_ssh_ingress_cidrs: ${{ secrets.SSH_INGRESS_CIDRS }}

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &setup_terraform
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - &write_api_signing_key
        name: Write API signing key
        run: |
          umask 077
          key_path="$RUNNER_TEMP/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_path"
          echo "TF_VAR_private_key_path=$key_path" >> "$GITHUB_ENV"
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      - &write_ssh_public_key
        name: Write SSH public key
        run: |
          key_path="$RUNNER_TEMP/oci_ssh_key.pub"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$key_path"
          echo "TF_VAR_ssh_public_key_path=$key_path" >> "$GITHUB_ENV"
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

      - &terraform_init
        name: Terraform init
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path"

      - name: Terraform validate
        run: terraform validate -no-color

      - &terraform_plan
        name: Terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Record plan in job summary
        run: |
          {
            echo "### Terraform Plan"
            echo '```terraform'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Named here and passed to the apply job so that re-running only a failed apply still finds this attempt's plan.
      - name: Name plan artifact
        id: plan_artifact
        run: echo "name=tfplan-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # Only the rendered plan is uploaded: the binary plan file holds variable values, sensitive ones included, and
      # artifacts on a public repository can be downloaded by anyone.
      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan_artifact.outputs.name }}
          path: src/tfplan.txt
          retention-days: 30

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('src/tfplan.txt', 'utf8');
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n...truncated, see the run summary for the full plan.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\n\`\`\`terraform\n${plan}\n\`\`\``,
            });

  apply:
    name: "Terraform Apply"
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-26.04

    # Waits for a required reviewer to approve the plan in the run summary. A merged change that would destroy the server
    # or the database stops here rather than applying on its own.
    environment: production

    defaults:
      run:
        working-directory: ./src

    env: *terraform_env

    steps:
      - *checkout
      - *setup_terraform
      - *write_api_signing_key
      - *write_ssh_public_key
      - *terraform_init
      - *terraform_plan

      - name: Download reviewed plan
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: reviewed

      # The binary plan cannot be carried over from the plan job (see Upload plan), so it is made again here. Apply only if
      # it matches what the reviewer approved; anything that changed in between needs a fresh run and a fresh approval.
      - name: Compare with reviewed plan
        run: diff -u ../reviewed/tfplan.txt tfplan.txt

      - name: Terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
